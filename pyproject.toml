[project]
name = "obd-consultas"
version = "0.1.0"
description = "Consultas vehiculares locales con conectores independientes"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "scrapling[fetchers,rag]>=0.5.1,<0.6",
    "ddddocr>=1.6,<2",
    "rapidocr-onnxruntime>=1.4,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[project.scripts]
obd-consultas = "obd_consultas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obd_consultas"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = [".cache", "artifacts"]

[tool.ruff.lint]
# E/F/W: errores y estilo base; I: orden de imports; B: bugs comunes;
# UP: sintaxis moderna; S: seguridad (bandit); SIM: simplificaciones.
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "E501",   # el formateo de lineas largas no bloquea
    "S101",   # assert se usa en tests
    "SIM105", # try/except/pass explicito es mas claro en los conectores
    "UP038",  # isinstance con tupla es mas rapido; la regla esta obsoleta en ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM117", "E731"]
"scripts/check_secrets.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["obd_consultas"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
files = ["src/obd_consultas"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[project]
name = "obd-consultas"
version = "0.1.0"
description = "Consultas vehiculares locales con conectores independientes"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "scrapling[fetchers,rag]>=0.5.1,<0.6",
    "ddddocr>=1.6,<2",
    "rapidocr-onnxruntime>=1.4,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1"]

[project.scripts]
obd-consultas = "obd_consultas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obd_consultas"]
